name: CI

on:
  push:
  pull_request:

# Unpublished sibling packages are built from the matching branch by ci/link-siblings.sh. The repositories are public,
# so no token is needed; ARION_REPOS_TOKEN (optional) is only used if they are made private.
env:
  ARION_REPOS_TOKEN: ${{ secrets.ARION_REPOS_TOKEN }}
  # packed sibling builds keyed by sibling commit, restored and saved by actions/cache
  ARION_SIBLINGS_CACHE: /home/runner/.arion-siblings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore the npm download cache and the packed sibling builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            /home/runner/.arion-siblings
            ~/.cache/ms-playwright
          key: arion-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.run_id }}
          restore-keys: |
            arion-${{ runner.os }}-${{ hashFiles('package.json') }}-
            arion-${{ runner.os }}-
      - run: bash ci/link-siblings.sh core pipeline c1
      - name: Environment files from the example
        run: for e in environment environment.dev environment.prod environment.test; do cp src/env/environment.example.ts src/env/$e.ts; done
      - run: npm run test:ci
      - run: npx ng build --configuration development
      - name: Smoke test of every route against recorded API responses (e2e/fixtures, re-record with npm run test:smoke:record)
        # Playwright is installed outside the project, so the siblings installed without saving are kept
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-audit --no-fund playwright@1.49.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" npm run test:smoke
